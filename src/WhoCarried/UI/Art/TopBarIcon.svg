<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64">
 <!-- The top-bar button's podium. One unit is one screen pixel at 1080p. Drawn by hand for the mod (no game art).
      The outline copies the game's own top-bar icons: black at 49% opacity, 3.2 units outside the shapes, behind them.
      It's one group so overlapping strokes don't darken where the shapes meet. Everything visible stays between
      y 1.3 and 62.2, the band the game's Map, Deck and Settings icons fill. -->
 <g opacity="0.49" fill="#000" stroke="#000" stroke-width="6.4" stroke-linejoin="round">
  <rect x="5" y="33" width="21" height="26" rx="1.5"/>
  <rect x="46" y="41" width="21" height="18" rx="1.5"/>
  <rect x="24" y="24" width="24" height="35" rx="1.5"/>
  <path d="M25.5 25 L23.5 8.5 L30.5 14.5 L36 4.5 L41.5 14.5 L48.5 8.5 L46.5 25 Z"/>
 </g>
 <!-- Blocks: second, third, then the winner's block on top. Each has a darker band at its foot. -->
 <rect x="5" y="33" width="21" height="26" rx="1.5" fill="#d8cfbd"/>
 <rect x="5" y="54" width="21" height="5" fill="#bcb29e"/>
 <rect x="46" y="41" width="21" height="18" rx="1.5" fill="#d8cfbd"/>
 <rect x="46" y="54" width="21" height="5" fill="#bcb29e"/>
 <rect x="24" y="24" width="24" height="35" rx="1.5" fill="#f3ecdf"/>
 <rect x="24" y="54" width="24" height="5" fill="#d6ccb9"/>
 <path d="M24 33 V59 M48 41 V59" stroke="#a59b87" stroke-width="1.4"/>
 <!-- The "1" -->
 <path d="M32.8 36.5 L37.3 33.3 V49" fill="none" stroke="#cf3a2e" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- Crown with a darker band and a red gem -->
 <path d="M25.5 25 L23.5 8.5 L30.5 14.5 L36 4.5 L41.5 14.5 L48.5 8.5 L46.5 25 Z" fill="#f1b434"/>
 <path d="M25.1 21.5 H46.9 L46.5 25 H25.5 Z" fill="#d4921f"/>
 <circle cx="36" cy="17.5" r="2.3" fill="#cf3a2e"/>
</svg>
